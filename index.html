<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找茬游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 15px;
        }

        .game-info {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8f9fa;
            padding: 10px 20px;
            border-radius: 10px;
        }

        .info-label {
            color: #666;
            font-size: 14px;
        }

        .info-value {
            color: #333;
            font-weight: bold;
            font-size: 18px;
        }

        .game-area {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            justify-content: center;
            flex-wrap: wrap;
        }

        .image-container {
            position: relative;
            width: 500px;
            height: 400px;
            border: 3px solid #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            cursor: crosshair;
            transition: border-color 0.3s;
        }

        .image-container:hover {
            border-color: #667eea;
        }

        .game-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .difference-marker {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 4px solid #28a745;
            border-radius: 50%;
            pointer-events: none;
            animation: pulse 1s ease-in-out infinite;
            background: rgba(40, 167, 69, 0.1);
        }

        .wrong-marker {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 4px solid #dc3545;
            border-radius: 50%;
            pointer-events: none;
            animation: shake 0.5s ease-in-out;
            background: rgba(220, 53, 69, 0.1);
        }

        @keyframes pulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 0.8;
            }
        }

        @keyframes shake {
            0%, 100% { transform: translate(-50%, -50%) translateX(0); }
            25% { transform: translate(-50%, -50%) translateX(-5px); }
            75% { transform: translate(-50%, -50%) translateX(5px); }
        }

        .difference-count {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        .difference-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #e9ecef;
            border: 2px solid #adb5bd;
            transition: all 0.3s;
        }

        .difference-dot.found {
            background: #28a745;
            border-color: #28a745;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .modal-content h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 28px;
        }

        .modal-content p {
            color: #666;
            margin-bottom: 25px;
            font-size: 16px;
        }

        .level-complete {
            color: #28a745;
        }

        .game-complete {
            color: #ffc107;
        }

        @media (max-width: 1100px) {
            .image-container {
                width: 400px;
                height: 320px;
            }
        }

        @media (max-width: 900px) {
            .image-container {
                width: 350px;
                height: 280px;
            }
            
            .game-info {
                gap: 20px;
            }
        }

        @media (max-width: 768px) {
            .image-container {
                width: 100%;
                height: 300px;
            }
            
            .header h1 {
                font-size: 24px;
            }
            
            .info-value {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🔍 找茬游戏</h1>
            <div class="game-info">
                <div class="info-item">
                    <span class="info-label">关卡:</span>
                    <span class="info-value" id="level-display">1 / 5</span>
                </div>
                <div class="info-item">
                    <span class="info-label">用时:</span>
                    <span class="info-value" id="time-display">00:00</span>
                </div>
                <div class="info-item">
                    <span class="info-label">错误:</span>
                    <span class="info-value" id="error-display">0</span>
                </div>
            </div>
        </div>

        <div class="difference-count" id="difference-dots">
            <div class="difference-dot"></div>
            <div class="difference-dot"></div>
            <div class="difference-dot"></div>
        </div>

        <div class="game-area">
            <div class="image-container" id="left-container">
                <img class="game-image" id="left-image" alt="左侧图片">
            </div>
            <div class="image-container" id="right-container">
                <img class="game-image" id="right-image" alt="右侧图片">
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-secondary" id="restart-btn">重新开始</button>
            <button class="btn btn-secondary" id="hint-btn">提示 (-3秒)</button>
        </div>
    </div>

    <div class="modal" id="level-complete-modal">
        <div class="modal-content">
            <h2 class="level-complete">🎉 恭喜过关！</h2>
            <p id="level-complete-message">本关用时: 00:00</p>
            <button class="btn btn-primary" id="next-level-btn">下一关</button>
        </div>
    </div>

    <div class="modal" id="game-complete-modal">
        <div class="modal-content">
            <h2 class="game-complete">🏆 游戏完成！</h2>
            <p id="game-complete-message">总用时: 00:00</p>
            <button class="btn btn-primary" id="play-again-btn">再玩一次</button>
        </div>
    </div>

    <div class="modal active" id="start-modal">
        <div class="modal-content">
            <h2>🔍 找茬游戏</h2>
            <p>找出左右两张图片中的3处不同<br>共5关，难度适中<br>点击错误的地方会增加错误计数</p>
            <button class="btn btn-primary" id="start-btn">开始游戏</button>
        </div>
    </div>

    <script>
        // 关卡数据 - 每关3处不同
        const levels = [
            {
                // 第1关 - 简单
                leftImage: "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=sunny%20beach%20scene%20with%20palm%20trees%2C%20blue%20ocean%2C%20yellow%20beach%20umbrella%2C%20red%20beach%20chair%2C%20a%20boy%20building%20sandcastle%2C%20three%20seagulls%20flying%20in%20the%20sky%2C%20colorful%20style&image_size=landscape_4_3",
                rightImage: "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=sunny%20beach%20scene%20with%20palm%20trees%2C%20blue%20ocean%2C%20blue%20beach%20umbrella%2C%20white%20beach%20chair%2C%20a%20girl%20building%20sandcastle%2C%20three%20seagulls%20flying%20in%20the%20sky%2C%20colorful%20style&image_size=landscape_4_3",
                differences: [
                    { x: 25, y: 50, description: "沙滩伞颜色" },
                    { x: 65, y: 60, description: "沙滩椅颜色" },
                    { x: 40, y: 75, description: "男孩变女孩" }
                ]
            },
            {
                // 第2关 - 中等
                leftImage: "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=cozy%20living%20room%20with%20brown%20sofa%2C%20white%20coffee%20table%2C%20green%20potted%20plant%2C%20bookshelf%20with%20red%20books%2C%20window%20with%20blue%20curtains%2C%20black%20cat%20sitting%20on%20floor%2C%20warm%20lighting%2C%20modern%20style&image_size=landscape_4_3",
                rightImage: "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=cozy%20living%20room%20with%20gray%20sofa%2C%20white%20coffee%20table%2C%20purple%20potted%20plant%2C%20bookshelf%20with%20red%20books%2C%20window%20with%20green%20curtains%2C%20black%20cat%20sitting%20on%20floor%2C%20warm%20lighting%2C%20modern%20style&image_size=landscape_4_3",
                differences: [
                    { x: 35, y: 35, description: "沙发颜色" },
                    { x: 15, y: 65, description: "盆栽颜色" },
                    { x: 85, y: 40, description: "窗帘颜色" }
                ]
            },
            {
                // 第3关 - 中等偏难
                leftImage: "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=busy%20street%20scene%20with%20red%20car%2C%20yellow%20taxi%2C%20people%20walking%2C%20tall%20buildings%2C%20blue%20sky%2C%20a%20man%20holding%20red%20umbrella%2C%20green%20traffic%20light%2C%20urban%20style&image_size=landscape_4_3",
                rightImage: "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=busy%20street%20scene%20with%20blue%20car%2C%20yellow%20taxi%2C%20people%20walking%2C%20tall%20buildings%2C%20blue%20sky%2C%20a%20man%20holding%20blue%20umbrella%2C%20red%20traffic%20light%2C%20urban%20style&image_size=landscape_4_3",
                differences: [
                    { x: 20, y: 60, description: "汽车颜色" },
                    { x: 50, y: 55, description: "雨伞颜色" },
                    { x: 75, y: 35, description: "红绿灯颜色" }
                ]
            },
            {
                // 第4关 - 较难
                leftImage: "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=autumn%20forest%20scene%20with%20orange%20trees%2C%20brown%20path%2C%20small%20lake%20with%20blue%20water%2C%20deer%20standing%20near%20lake%2C%20sunlight%20filtering%20through%20trees%2C%20fallen%20leaves%2C%20peaceful%20nature&image_size=landscape_4_3",
                rightImage: "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=autumn%20forest%20scene%20with%20orange%20trees%2C%20gray%20path%2C%20small%20lake%20with%20green%20water%2C%20rabbit%20standing%20near%20lake%2C%20sunlight%20filtering%20through%20trees%2C%20fallen%20leaves%2C%20peaceful%20nature&image_size=landscape_4_3",
                differences: [
                    { x: 40, y: 80, description: "小路颜色" },
                    { x: 60, y: 50, description: "湖水颜色" },
                    { x: 70, y: 65, description: "鹿变兔子" }
                ]
            },
            {
                // 第5关 - 最难
                leftImage: "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=birthday%20party%20scene%20with%20colorful%20balloons%2C%20birthday%20cake%20with%203%20candles%2C%20children%20wearing%20party%20hats%2C%20presents%20with%20red%20wrapping%2C%20streamers%2C%20happy%20faces%2C%20festive%20atmosphere&image_size=landscape_4_3",
                rightImage: "https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=birthday%20party%20scene%20with%20colorful%20balloons%2C%20birthday%20cake%20with%205%20candles%2C%20children%20wearing%20party%20hats%2C%20presents%20with%20blue%20wrapping%2C%20streamers%2C%20happy%20faces%2C%20festive%20atmosphere&image_size=landscape_4_3",
                differences: [
                    { x: 45, y: 40, description: "蜡烛数量" },
                    { x: 25, y: 70, description: "礼物包装颜色" },
                    { x: 75, y: 55, description: "少了一个气球" }
                ]
            }
        ];

        // 游戏状态
        let currentLevel = 0;
        let foundDifferences = new Set();
        let errors = 0;
        let timer = null;
        let startTime = null;
        let totalStartTime = null;
        let hintsUsed = 0;

        // DOM 元素
        const leftImage = document.getElementById('left-image');
        const rightImage = document.getElementById('right-image');
        const leftContainer = document.getElementById('left-container');
        const rightContainer = document.getElementById('right-container');
        const levelDisplay = document.getElementById('level-display');
        const timeDisplay = document.getElementById('time-display');
        const errorDisplay = document.getElementById('error-display');
        const differenceDots = document.getElementById('difference-dots');
        const startModal = document.getElementById('start-modal');
        const levelCompleteModal = document.getElementById('level-complete-modal');
        const gameCompleteModal = document.getElementById('game-complete-modal');
        const levelCompleteMessage = document.getElementById('level-complete-message');
        const gameCompleteMessage = document.getElementById('game-complete-message');

        // 格式化时间
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // 更新计时器
        function updateTimer() {
            const elapsed = (Date.now() - startTime) / 1000;
            timeDisplay.textContent = formatTime(elapsed);
        }

        // 开始计时器
        function startTimer() {
            if (timer) clearInterval(timer);
            startTime = Date.now();
            if (!totalStartTime) totalStartTime = Date.now();
            timer = setInterval(updateTimer, 100);
        }

        // 停止计时器
        function stopTimer() {
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
        }

        // 更新关卡显示
        function updateLevelDisplay() {
            levelDisplay.textContent = `${currentLevel + 1} / ${levels.length}`;
        }

        // 更新差异点显示
        function updateDifferenceDots() {
            const dots = differenceDots.querySelectorAll('.difference-dot');
            const levelDifferences = levels[currentLevel].differences;
            
            dots.forEach((dot, index) => {
                if (foundDifferences.has(index)) {
                    dot.classList.add('found');
                } else {
                    dot.classList.remove('found');
                }
            });
        }

        // 加载关卡
        function loadLevel(levelIndex) {
            currentLevel = levelIndex;
            foundDifferences = new Set();
            errors = 0;
            hintsUsed = 0;
            
            errorDisplay.textContent = '0';
            updateLevelDisplay();
            updateDifferenceDots();
            
            // 清除所有标记
            const markers = document.querySelectorAll('.difference-marker, .wrong-marker');
            markers.forEach(marker => marker.remove());
            
            // 加载图片
            const level = levels[levelIndex];
            leftImage.src = level.leftImage;
            rightImage.src = level.rightImage;
            
            // 等待图片加载
            leftImage.onload = () => {
                startTimer();
            };
            
            rightImage.onload = () => {
                // 确保左侧图片也加载了才开始计时
            };
        }

        // 检查点击位置是否是差异点
        function checkDifference(xPercent, yPercent, container) {
            const level = levels[currentLevel];
            const tolerance = 12; // 百分比容差
            
            for (let i = 0; i < level.differences.length; i++) {
                if (foundDifferences.has(i)) continue;
                
                const diff = level.differences[i];
                const distance = Math.sqrt(
                    Math.pow(xPercent - diff.x, 2) + 
                    Math.pow(yPercent - diff.y, 2)
                );
                
                if (distance <= tolerance) {
                    // 找到了差异点
                    foundDifferences.add(i);
                    updateDifferenceDots();
                    
                    // 在两侧都显示标记
                    createMarker(diff.x, diff.y, leftContainer, 'difference-marker');
                    createMarker(diff.x, diff.y, rightContainer, 'difference-marker');
                    
                    // 检查是否完成关卡
                    if (foundDifferences.size === level.differences.length) {
                        levelComplete();
                    }
                    
                    return true;
                }
            }
            
            return false;
        }

        // 创建标记
        function createMarker(xPercent, yPercent, container, className) {
            const marker = document.createElement('div');
            marker.className = className;
            
            const containerRect = container.getBoundingClientRect();
            const x = (xPercent / 100) * containerRect.width;
            const y = (yPercent / 100) * containerRect.height;
            
            marker.style.left = `${x}px`;
            marker.style.top = `${y}px`;
            marker.style.transform = 'translate(-50%, -50%)';
            
            container.appendChild(marker);
            
            if (className === 'wrong-marker') {
                setTimeout(() => {
                    marker.remove();
                }, 500);
            }
        }

        // 处理点击
        function handleClick(e, container) {
            if (foundDifferences.size >= levels[currentLevel].differences.length) return;
            
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const xPercent = (x / rect.width) * 100;
            const yPercent = (y / rect.height) * 100;
            
            const isCorrect = checkDifference(xPercent, yPercent, container);
            
            if (!isCorrect) {
                // 错误点击
                errors++;
                errorDisplay.textContent = errors;
                
                // 在两侧都显示错误标记
                createMarker(xPercent, yPercent, leftContainer, 'wrong-marker');
                createMarker(xPercent, yPercent, rightContainer, 'wrong-marker');
            }
        }

        // 关卡完成
        function levelComplete() {
            stopTimer();
            const elapsed = (Date.now() - startTime) / 1000;
            levelCompleteMessage.textContent = `本关用时: ${formatTime(elapsed)}`;
            
            if (currentLevel === levels.length - 1) {
                // 游戏完成
                setTimeout(() => {
                    const totalTime = (Date.now() - totalStartTime) / 1000;
                    gameCompleteMessage.textContent = `总用时: ${formatTime(totalTime)}\n总错误: ${errors}`;
                    gameCompleteModal.classList.add('active');
                }, 1000);
            } else {
                setTimeout(() => {
                    levelCompleteModal.classList.add('active');
                }, 1000);
            }
        }

        // 使用提示
        function useHint() {
            const level = levels[currentLevel];
            const unfound = [];
            
            for (let i = 0; i < level.differences.length; i++) {
                if (!foundDifferences.has(i)) {
                    unfound.push(i);
                }
            }
            
            if (unfound.length === 0) return;
            
            // 增加时间惩罚
            startTime -= 3000;
            
            // 随机选择一个未找到的差异点显示标记
            const randomIndex = unfound[Math.floor(Math.random() * unfound.length)];
            const diff = level.differences[randomIndex];
            
            // 临时显示标记
            const tempMarkerLeft = document.createElement('div');
            tempMarkerLeft.className = 'difference-marker';
            tempMarkerLeft.style.opacity = '0.5';
            tempMarkerLeft.style.left = `${diff.x}%`;
            tempMarkerLeft.style.top = `${diff.y}%`;
            leftContainer.appendChild(tempMarkerLeft);
            
            const tempMarkerRight = document.createElement('div');
            tempMarkerRight.className = 'difference-marker';
            tempMarkerRight.style.opacity = '0.5';
            tempMarkerRight.style.left = `${diff.x}%`;
            tempMarkerRight.style.top = `${diff.y}%`;
            rightContainer.appendChild(tempMarkerRight);
            
            setTimeout(() => {
                tempMarkerLeft.remove();
                tempMarkerRight.remove();
            }, 2000);
        }

        // 重新开始
        function restartGame() {
            stopTimer();
            totalStartTime = null;
            currentLevel = 0;
            foundDifferences = new Set();
            errors = 0;
            hintsUsed = 0;
            
            gameCompleteModal.classList.remove('active');
            levelCompleteModal.classList.remove('active');
            
            loadLevel(0);
        }

        // 事件监听器
        leftContainer.addEventListener('click', (e) => handleClick(e, leftContainer));
        rightContainer.addEventListener('click', (e) => handleClick(e, rightContainer));

        document.getElementById('start-btn').addEventListener('click', () => {
            startModal.classList.remove('active');
            loadLevel(0);
        });

        document.getElementById('next-level-btn').addEventListener('click', () => {
            levelCompleteModal.classList.remove('active');
            loadLevel(currentLevel + 1);
        });

        document.getElementById('play-again-btn').addEventListener('click', () => {
            restartGame();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            restartGame();
        });

        document.getElementById('hint-btn').addEventListener('click', () => {
            useHint();
        });
    </script>
</body>
</html>
