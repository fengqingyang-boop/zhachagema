<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找茬游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .game-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 1200px;
            width: 100%;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #333; font-size: 32px; margin-bottom: 15px; }
        .game-info { display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; }
        .info-item {
            display: flex; align-items: center; gap: 10px;
            background: #f8f9fa; padding: 10px 20px; border-radius: 10px;
        }
        .info-label { color: #666; font-size: 14px; }
        .info-value { color: #333; font-weight: bold; font-size: 18px; }
        .game-area { display: flex; gap: 20px; margin: 20px 0; justify-content: center; flex-wrap: wrap; }
        .scene-container {
            position: relative; width: 500px; height: 400px;
            border: 3px solid #e9ecef; border-radius: 10px; overflow: hidden;
            cursor: crosshair; transition: border-color 0.3s;
        }
        .scene-container:hover { border-color: #667eea; }
        .scene-svg { width: 100%; height: 100%; }
        .difference-marker {
            position: absolute; width: 60px; height: 60px;
            border: 4px solid #28a745; border-radius: 50%;
            pointer-events: none; animation: pulse 1s ease-in-out infinite;
            background: rgba(40, 167, 69, 0.1);
        }
        .wrong-marker {
            position: absolute; width: 60px; height: 60px;
            border: 4px solid #dc3545; border-radius: 50%;
            pointer-events: none; animation: shake 0.5s ease-in-out;
            background: rgba(220, 53, 69, 0.1);
        }
        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.8; }
        }
        @keyframes shake {
            0%, 100% { transform: translate(-50%, -50%) translateX(0); }
            25% { transform: translate(-50%, -50%) translateX(-5px); }
            75% { transform: translate(-50%, -50%) translateX(5px); }
        }
        .difference-count { display: flex; justify-content: center; gap: 20px; margin: 20px 0; }
        .difference-dot {
            width: 20px; height: 20px; border-radius: 50%;
            background: #e9ecef; border: 2px solid #adb5bd; transition: all 0.3s;
        }
        .difference-dot.found { background: #28a745; border-color: #28a745; }
        .controls { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .btn {
            padding: 12px 30px; border: none; border-radius: 25px;
            font-size: 16px; cursor: pointer; transition: all 0.3s; font-weight: bold;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-secondary:hover { background: #5a6268; transform: translateY(-2px); }
        .modal {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7);
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white; padding: 40px; border-radius: 20px;
            text-align: center; max-width: 400px; width: 90%;
        }
        .modal-content h2 { color: #333; margin-bottom: 15px; font-size: 28px; }
        .modal-content p { color: #666; margin-bottom: 25px; font-size: 16px; }
        .level-complete { color: #28a745; }
        .game-complete { color: #ffc107; }
        .scene-label {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6); color: white; padding: 5px 15px;
            border-radius: 15px; font-size: 14px; font-weight: bold; pointer-events: none;
        }
        @media (max-width: 1100px) { .scene-container { width: 400px; height: 320px; } }
        @media (max-width: 900px) { .scene-container { width: 350px; height: 280px; } }
        @media (max-width: 768px) {
            .scene-container { width: 100%; height: 300px; }
            .header h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🔍 找茬游戏</h1>
            <div class="game-info">
                <div class="info-item"><span class="info-label">关卡:</span><span class="info-value" id="level-display">1 / 5</span></div>
                <div class="info-item"><span class="info-label">用时:</span><span class="info-value" id="time-display">00:00</span></div>
                <div class="info-item"><span class="info-label">错误:</span><span class="info-value" id="error-display">0</span></div>
            </div>
        </div>
        <div class="difference-count" id="difference-dots">
            <div class="difference-dot"></div><div class="difference-dot"></div><div class="difference-dot"></div>
        </div>
        <div class="game-area">
            <div class="scene-container" id="left-container">
                <div class="scene-label">左图</div>
                <svg class="scene-svg" id="left-svg" viewBox="0 0 500 400"></svg>
            </div>
            <div class="scene-container" id="right-container">
                <div class="scene-label">右图</div>
                <svg class="scene-svg" id="right-svg" viewBox="0 0 500 400"></svg>
            </div>
        </div>
        <div class="controls">
            <button class="btn btn-secondary" id="restart-btn">重新开始</button>
            <button class="btn btn-secondary" id="hint-btn">提示 (-3秒)</button>
        </div>
    </div>
    
    <div class="modal" id="level-complete-modal">
        <div class="modal-content">
            <h2 class="level-complete">🎉 恭喜过关！</h2>
            <p id="level-complete-message">本关用时: 00:00</p>
            <button class="btn btn-primary" id="next-level-btn">下一关</button>
        </div>
    </div>
    
    <div class="modal" id="game-complete-modal">
        <div class="modal-content">
            <h2 class="game-complete">🏆 游戏完成！</h2>
            <p id="game-complete-message">总用时: 00:00</p>
            <button class="btn btn-primary" id="play-again-btn">再玩一次</button>
        </div>
    </div>
    
    <div class="modal active" id="start-modal">
        <div class="modal-content">
            <h2>🔍 找茬游戏</h2>
            <p>找出左右两张图片中的3处不同<br>共5关，难度适中<br>点击错误的地方会增加错误计数</p>
            <button class="btn btn-primary" id="start-btn">开始游戏</button>
        </div>
    </div>

    <script>
        const levels = [
            {
                name: "海滩风景",
                difficulty: "简单",
                differences: [
                    { x: 10, y: 55, description: "太阳伞颜色", type: "color", targetId: "umbrella", original: "#FFD700", different: "#4169E1" },
                    { x: 64, y: 62, description: "沙滩椅颜色", type: "color", targetId: "chair", original: "#FF6347", different: "#FFFFFF" },
                    { x: 40, y: 75, description: "帽子颜色", type: "color", targetId: "hat", original: "#FF69B4", different: "#00CED1" }
                ]
            },
            {
                name: "温馨客厅",
                difficulty: "中等",
                differences: [
                    { x: 32, y: 50, description: "沙发颜色", type: "color", targetId: "sofa", original: "#8B4513", different: "#808080" },
                    { x: 14, y: 70, description: "盆栽颜色", type: "color", targetId: "plant", original: "#228B22", different: "#9370DB" },
                    { x: 76, y: 35, description: "窗帘颜色", type: "color", targetId: "curtain", original: "#4169E1", different: "#228B22" }
                ]
            },
            {
                name: "城市街道",
                difficulty: "中等偏难",
                differences: [
                    { x: 16, y: 68, description: "汽车颜色", type: "color", targetId: "car", original: "#DC143C", different: "#1E90FF" },
                    { x: 50, y: 49, description: "雨伞颜色", type: "color", targetId: "umbrella", original: "#DC143C", different: "#4169E1" },
                    { x: 50, y: 42, description: "红绿灯", type: "light", targetId: "light", original: "#228B22", different: "#DC143C" }
                ]
            },
            {
                name: "秋日森林",
                difficulty: "较难",
                differences: [
                    { x: 56, y: 50, description: "湖水颜色", type: "color", targetId: "lake", original: "#4169E1", different: "#228B22" },
                    { x: 70, y: 65, description: "动物形状", type: "shape", targetId: "animal", original: "deer", different: "rabbit" },
                    { x: 40, y: 85, description: "小路颜色", type: "color", targetId: "path", original: "#8B4513", different: "#808080" }
                ]
            },
            {
                name: "生日派对",
                difficulty: "最难",
                differences: [
                    { x: 50, y: 55, description: "蜡烛数量", type: "count", targetId: "candles", original: 3, different: 5 },
                    { x: 12, y: 45, description: "气球颜色", type: "color", targetId: "balloon", original: "#FF69B4", different: "#FFD700" },
                    { x: 88, y: 45, description: "礼物颜色", type: "color", targetId: "gift", original: "#DC143C", different: "#4169E1" }
                ]
            }
        ];

        let currentLevel = 0, foundDifferences = new Set(), errors = 0;
        let timer = null, startTime = null, totalStartTime = null;
        const leftSVG = document.getElementById('left-svg');
        const rightSVG = document.getElementById('right-svg');
        const leftContainer = document.getElementById('left-container');
        const rightContainer = document.getElementById('right-container');

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        function updateTimer() {
            document.getElementById('time-display').textContent = formatTime((Date.now() - startTime) / 1000);
        }
        function startTimer() {
            if (timer) clearInterval(timer);
            startTime = Date.now();
            if (!totalStartTime) totalStartTime = Date.now();
            timer = setInterval(updateTimer, 100);
        }
        function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }
        function updateLevelDisplay() {
            document.getElementById('level-display').textContent = `${currentLevel + 1} / ${levels.length}`;
        }
        function updateDifferenceDots() {
            const dots = document.querySelectorAll('.difference-dot');
            dots.forEach((dot, i) => {
                dot.classList.toggle('found', foundDifferences.has(i));
            });
        }

        function createBeachScene(svg, isRight) {
            const level = levels[currentLevel];
            const umbrellaColor = isRight ? level.differences[0].different : level.differences[0].original;
            const chairColor = isRight ? level.differences[1].different : level.differences[1].original;
            const hatColor = isRight ? level.differences[2].different : level.differences[2].original;
            
            svg.innerHTML = `
                <defs>
                    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#87CEEB"/><stop offset="100%" stop-color="#E0F7FF"/>
                    </linearGradient>
                    <linearGradient id="ocean" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#4169E1"/><stop offset="100%" stop-color="#1E90FF"/>
                    </linearGradient>
                    <linearGradient id="sand" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#F4D03F"/><stop offset="100%" stop-color="#E6BE8A"/>
                    </linearGradient>
                </defs>
                <rect x="0" y="0" width="500" height="200" fill="url(#sky)"/>
                <circle cx="420" cy="50" r="35" fill="#FFD700"/>
                <g opacity="0.8">
                    <ellipse cx="100" cy="70" rx="30" ry="15" fill="white"/>
                    <ellipse cx="120" cy="65" rx="20" ry="12" fill="white"/>
                    <ellipse cx="80" cy="68" rx="18" ry="10" fill="white"/>
                </g>
                <rect x="0" y="200" width="500" height="80" fill="url(#ocean)"/>
                <path d="M0,210 Q50,200 100,210 T200,210 T300,210 T400,210 T500,210" stroke="white" stroke-width="2" fill="none" opacity="0.5"/>
                <rect x="0" y="280" width="500" height="120" fill="url(#sand)"/>
                
                <g transform="translate(50, 220)">
                    <rect x="-3" y="0" width="6" height="50" fill="#8B4513"/>
                    <path d="M-30,-15 Q0,-45 30,-15 L25,0 L-25,0 Z" fill="${umbrellaColor}" id="umbrella"/>
                </g>
                
                <g transform="translate(320, 250)">
                    <rect x="-25" y="0" width="50" height="8" fill="${chairColor}" id="chair" rx="2"/>
                    <rect x="-20" y="-25" width="40" height="25" fill="${chairColor}" rx="2"/>
                    <rect x="-22" y="8" width="4" height="20" fill="#8B4513"/>
                    <rect x="18" y="8" width="4" height="20" fill="#8B4513"/>
                </g>
                
                <g transform="translate(200, 300)">
                    <circle cx="0" cy="-15" r="15" fill="#FFDAB9"/>
                    <circle cx="-5" cy="-18" r="3" fill="#333"/>
                    <circle cx="5" cy="-18" r="3" fill="#333"/>
                    <ellipse cx="0" cy="15" rx="20" ry="18" fill="${hatColor}" id="hat"/>
                </g>
                
                <ellipse cx="80" cy="350" rx="12" ry="8" fill="#DEB887"/>
                <ellipse cx="450" cy="340" rx="15" ry="10" fill="#D2B48C"/>
            `;
        }

        function createLivingRoomScene(svg, isRight) {
            const level = levels[currentLevel];
            const sofaColor = isRight ? level.differences[0].different : level.differences[0].original;
            const plantColor = isRight ? level.differences[1].different : level.differences[1].original;
            const curtainColor = isRight ? level.differences[2].different : level.differences[2].original;
            
            svg.innerHTML = `
                <defs>
                    <linearGradient id="wall" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#F5F5DC"/><stop offset="100%" stop-color="#FAEBD7"/>
                    </linearGradient>
                    <linearGradient id="floor" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#8B4513"/><stop offset="100%" stop-color="#A0522D"/>
                    </linearGradient>
                </defs>
                <rect x="0" y="0" width="500" height="300" fill="url(#wall)"/>
                <rect x="0" y="300" width="500" height="100" fill="url(#floor)"/>
                
                <rect x="380" y="50" width="100" height="180" fill="#87CEEB" stroke="#8B4513" stroke-width="4"/>
                <line x1="430" y1="50" x2="430" y2="230" stroke="#8B4513" stroke-width="3"/>
                <line x1="380" y1="140" x2="480" y2="140" stroke="#8B4513" stroke-width="3"/>
                
                <rect x="370" y="40" width="25" height="200" fill="${curtainColor}" id="curtain"/>
                
                <g transform="translate(160, 200)">
                    <rect x="-100" y="-30" width="200" height="80" fill="${sofaColor}" id="sofa" rx="10"/>
                    <rect x="-110" y="-60" width="220" height="40" fill="${sofaColor}" rx="10"/>
                    <rect x="-110" y="0" width="15" height="50" fill="${sofaColor}" rx="5"/>
                    <rect x="95" y="0" width="15" height="50" fill="${sofaColor}" rx="5"/>
                    <circle cx="-50" cy="-40" r="15" fill="#D2B48C" opacity="0.5"/>
                    <circle cx="50" cy="-40" r="15" fill="#D2B48C" opacity="0.5"/>
                </g>
                
                <g transform="translate(70, 280)">
                    <rect x="-8" y="0" width="16" height="60" fill="#8B4513"/>
                    <ellipse cx="0" cy="-10" rx="25" ry="35" fill="${plantColor}" id="plant"/>
                    <ellipse cx="-15" cy="0" rx="15" ry="25" fill="${plantColor}" opacity="0.8"/>
                    <ellipse cx="15" cy="-5" rx="15" ry="20" fill="${plantColor}" opacity="0.8"/>
                </g>
                
                <g transform="translate(250, 280)">
                    <rect x="-40" y="-5" width="80" height="10" fill="#D2B48C"/>
                    <rect x="-35" y="5" width="10" height="20" fill="#8B4513"/>
                    <rect x="25" y="5" width="10" height="20" fill="#8B4513"/>
                    <rect x="-25" y="-20" width="20" height="15" fill="#8B4513"/>
                    <circle cx="15" cy="-10" r="8" fill="#A0522D"/>
                </g>
                
                <g transform="translate(420, 150)">
                    <rect x="-40" y="-50" width="80" height="100" fill="#2F2F2F" rx="5"/>
                    <rect x="-35" y="-45" width="70" height="90" fill="#1a1a2e"/>
                    <rect x="-30" y="-40" width="60" height="80" fill="#3498db"/>
                </g>
                
                <g transform="translate(390, 290)">
                    <circle cx="0" cy="0" r="12" fill="#2C2C2C"/>
                    <polygon points="0,-15 -8,0 8,0" fill="#FF69B4"/>
                    <circle cx="-5" cy="-2" r="3" fill="#90EE90"/>
                    <circle cx="5" cy="-2" r="3" fill="#90EE90"/>
                </g>
            `;
        }

        function createStreetScene(svg, isRight) {
            const level = levels[currentLevel];
            const carColor = isRight ? level.differences[0].different : level.differences[0].original;
            const umbrellaColor = isRight ? level.differences[1].different : level.differences[1].original;
            const lightColor = isRight ? level.differences[2].different : level.differences[2].original;
            const otherLightColor = isRight ? level.differences[2].original : level.differences[2].different;
            
            svg.innerHTML = `
                <defs>
                    <linearGradient id="sky-street" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#87CEEB"/><stop offset="100%" stop-color="#E0F7FF"/>
                    </linearGradient>
                    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#696969"/><stop offset="100%" stop-color="#808080"/>
                    </linearGradient>
                    <linearGradient id="sidewalk" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#D3D3D3"/><stop offset="100%" stop-color="#A9A9A9"/>
                    </linearGradient>
                </defs>
                <rect x="0" y="0" width="500" height="200" fill="url(#sky-street)"/>
                <circle cx="450" cy="40" r="30" fill="#FFD700"/>
                <g opacity="0.7">
                    <ellipse cx="80" cy="60" rx="35" ry="18" fill="white"/>
                    <ellipse cx="110" cy="55" rx="25" ry="15" fill="white"/>
                </g>
                
                <g transform="translate(30, 120)">
                    <rect x="0" y="0" width="50" height="80" fill="#CD853F"/>
                    <rect x="5" y="10" width="15" height="15" fill="#87CEEB"/>
                    <rect x="30" y="10" width="15" height="15" fill="#87CEEB"/>
                </g>
                
                <g transform="translate(100, 80)">
                    <rect x="0" y="0" width="60" height="120" fill="#4682B4"/>
                    <rect x="5" y="15" width="20" height="20" fill="#87CEEB"/>
                    <rect x="35" y="15" width="20" height="20" fill="#87CEEB"/>
                </g>
                
                <g transform="translate(200, 100)">
                    <rect x="0" y="0" width="70" height="100" fill="#DEB887"/>
                    <rect x="5" y="10" width="25" height="25" fill="#87CEEB"/>
                    <rect x="40" y="10" width="25" height="25" fill="#87CEEB"/>
                </g>
                
                <g transform="translate(350, 90)">
                    <rect x="0" y="0" width="55" height="110" fill="#B0C4DE"/>
                    <rect x="5" y="10" width="20" height="20" fill="#87CEEB"/>
                    <rect x="30" y="10" width="20" height="20" fill="#87CEEB"/>
                </g>
                
                <g transform="translate(420, 130)">
                    <rect x="0" y="0" width="70" height="70" fill="#F0E68C"/>
                    <rect x="10" y="10" width="20" height="20" fill="#87CEEB"/>
                    <rect x="40" y="10" width="20" height="20" fill="#87CEEB"/>
                </g>
                
                <rect x="0" y="200" width="500" height="30" fill="url(#sidewalk)"/>
                <rect x="0" y="230" width="500" height="170" fill="url(#road)"/>
                
                <g fill="#FFD700">
                    <rect x="30" y="310" width="40" height="8"/><rect x="100" y="310" width="40" height="8"/>
                    <rect x="170" y="310" width="40" height="8"/><rect x="240" y="310" width="40" height="8"/>
                    <rect x="310" y="310" width="40" height="8"/><rect x="380" y="310" width="40" height="8"/>
                </g>
                
                <g transform="translate(80, 270)">
                    <rect x="-35" y="-15" width="70" height="30" fill="${carColor}" id="car" rx="5"/>
                    <rect x="-30" y="-25" width="35" height="12" fill="${carColor}" rx="3"/>
                    <rect x="-25" y="-23" width="25" height="8" fill="#87CEEB" rx="2"/>
                    <circle cx="-25" cy="15" r="8" fill="#2F2F2F"/>
                    <circle cx="25" cy="15" r="8" fill="#2F2F2F"/>
                </g>
                
                <g transform="translate(250, 205)">
                    <rect x="0" y="0" width="8" height="35" fill="#2F2F2F"/>
                    <g transform="translate(-12, -40)">
                        <rect x="0" y="0" width="32" height="40" fill="#1a1a1a" rx="3"/>
                        <circle cx="16" cy="10" r="6" fill="${lightColor}" id="light"/>
                        <circle cx="16" cy="30" r="6" fill="${otherLightColor}"/>
                    </g>
                </g>
                
                <g transform="translate(350, 195)">
                    <circle cx="0" cy="-10" r="10" fill="#FFDAB9"/>
                    <rect x="-10" y="0" width="20" height="35" fill="#4169E1"/>
                    <circle cx="-4" cy="-12" r="2" fill="#333"/>
                    <circle cx="4" cy="-12" r="2" fill="#333"/>
                    <line x1="0" y1="10" x2="0" y2="-30" stroke="#4A4A4A" stroke-width="1"/>
                    <path d="M-25,-20 Q0,-40 25,-20 L20,-15 L-20,-15 Z" fill="${umbrellaColor}" id="umbrella"/>
                </g>
            `;
        }

        function createForestScene(svg, isRight) {
            const level = levels[currentLevel];
            const lakeColor = isRight ? level.differences[0].different : level.differences[0].original;
            const animalType = isRight ? level.differences[1].different : level.differences[1].original;
            const pathColor = isRight ? level.differences[2].different : level.differences[2].original;
            
            let animal = '';
            if (animalType === 'deer') {
                animal = `
                    <g transform="translate(350, 260)" id="animal">
                        <ellipse cx="0" cy="15" rx="25" ry="15" fill="#8B4513"/>
                        <circle cx="-20" cy="0" r="12" fill="#CD853F"/>
                        <ellipse cx="-30" cy="-15" rx="5" ry="12" fill="#CD853F"/>
                        <ellipse cx="-15" cy="-15" rx="5" ry="12" fill="#CD853F"/>
                        <circle cx="-25" cy="-2" r="2" fill="#333"/>

            }
            
            svg.innerHTML = `
                <defs>
                    <linearGradient id="sky-forest" x1="0%" y1="0%" x2="0%" y2="100%">

                    <linearGradient id="lake-water" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="${lakeColor}"/><stop offset="100%" stop-color="${darkenColor(lakeColor)}"/>

                    <linearGradient id="forest-path" x1="0%" y1="0%" x2="100%" y2="0%">

                </defs>
                <rect x="0" y="0" width="500" height="250" fill="url(#sky-forest)"/>
                <circle cx="420" cy="60" r="50" fill="#FFD700" opacity="0.8"/>
                
                <polygon points="0,200 50,120 100,180 150,100 200,170 250,90 300,160 350,80 400,150 450,100 500,180 500,300 0,300" fill="#4A7023" opacity="0.6"/>
                <polygon points="0,220 60,150 120,210 180,130 240,200 300,120 360,190 420,110 480,180 500,200 500,320 0,320" fill="#228B22" opacity="0.7"/>
                
                <rect x="0" y="320" width="500" height="80" fill="#228B22"/>
                
                <ellipse cx="300" cy="200" rx="80" ry="35" fill="url(#lake-water)" id="lake"/>
                <ellipse cx="300" cy="195" rx="60" ry="25" fill="rgba(255,255,255,0.1)"/>
                
                <path d="M200,400 Q250,380 280,340 Q310,300 330,260 Q340,235 330,220" 
                      stroke="${pathColor}" stroke-width="25" fill="none"/>
                
                <g transform="translate(60, 250)">
                    <rect x="-12" y="0" width="24" height="70" fill="#8B4513"/>
                    <polygon points="0,-80 -40,20 40,20" fill="#DAA520"/>
                    <polygon points="0,-50 -35,30 35,30" fill="#FF8C00"/>
                    <polygon points="0,-20 -30,35 30,35" fill="#FF6347"/>
                </g>
                
                <g transform="translate(130, 280)">
                    <rect x="-8" y="0" width="16" height="45" fill="#8B4513"/>
                    <polygon points="0,-50 -30,15 30,15" fill="#DAA520"/>
                    <polygon points="0,-25 -25,20 25,20" fill="#FF8C00"/>
                </g>
                
                <g transform="translate(450, 240)">
                    <rect x="-15" y="0" width="30" height="80" fill="#8B4513"/>
                    <polygon points="0,-90 -50,25 50,25" fill="#DAA520"/>
                    <polygon points="0,-60 -45,30 45,30" fill="#FF8C00"/>
                    <polygon points="0,-30 -40,35 40,35" fill="#FF6347"/>
                </g>
                
                <g transform="translate(180, 290)">
                    <rect x="-3" y="0" width="6" height="25" fill="#D2B48C"/>
                    <ellipse cx="0" cy="0" rx="25" ry="12" fill="#FFD700"/>
                    <circle cx="0" cy="0" r="5" fill="#8B4513"/>
                </g>
                
                <g transform="translate(100, 340)">
                    <rect x="-2" y="0" width="4" height="10" fill="#228B22"/>
                    <circle cx="0" cy="0" r="6" fill="#FF69B4"/>
                    <circle cx="0" cy="0" r="3" fill="#FFD700"/>
                </g>
                
                ${animal}
            `;
        }

        function createPartyScene(svg, isRight) {
            const level = levels[currentLevel];
            const candleCount = isRight ? level.differences[0].different : level.differences[0].original;
            const balloonColor = isRight ? level.differences[1].different : level.differences[1].original;
            const giftColor = isRight ? level.differences[2].different : level.differences[2].original;
            
            let candles = '';
            const spacing = candleCount === 3 ? 15 : 10;
            const startX = candleCount === 3 ? -15 : -20;
            const colors = ['#FF69B4', '#87CEEB', '#FFD700', '#90EE90', '#FF6347'];
            for (let i = 0; i < candleCount; i++) {
                const x = startX + i * spacing;
                candles += `<rect x="${x}" y="-35" width="6" height="25" fill="${colors[i % 5]}" id="candles"/><ellipse cx="${x+3}" cy="-38" rx="4" ry="6" fill="#FFD700"/>`;
            }
            
            svg.innerHTML = `
                <defs>
                    <linearGradient id="wall-party" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#FFF8DC"/><stop offset="100%" stop-color="#FFEFD5"/>
                    </linearGradient>
                    <linearGradient id="floor-party" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#DEB887"/><stop offset="100%" stop-color="#D2B48C"/>
                    </linearGradient>
                </defs>
                <rect x="0" y="0" width="500" height="300" fill="url(#wall-party)"/>
                <rect x="0" y="300" width="500" height="100" fill="url(#floor-party)"/>
                
                <g id="streamers">
                    <path d="M0,50 Q50,70 100,50 T200,50 T300,50 T400,50 T500,50" stroke="#FF69B4" stroke-width="8" fill="none"/>
                    <path d="M0,80 Q50,60 100,80 T200,80 T300,80 T400,80 T500,80" stroke="#87CEEB" stroke-width="8" fill="none"/>
                    <path d="M0,110 Q50,130 100,110 T200,110 T300,110 T400,110 T500,110" stroke="#FFD700" stroke-width="8" fill="none"/>
                </g>
                
                <g transform="translate(60, 180)">
                    <ellipse cx="0" cy="-25" rx="25" ry="35" fill="${balloonColor}" id="balloon"/>
                    <rect x="-4" y="-5" width="8" height="40" fill="#8B4513"/>
                </g>
                
                <g transform="translate(110, 200)">
                    <ellipse cx="0" cy="-20" rx="20" ry="28" fill="#87CEEB"/>
                    <rect x="-3" y="2" width="6" height="30" fill="#8B4513"/>
                </g>
                
                <g transform="translate(380, 180)">
                    <ellipse cx="0" cy="-25" rx="22" ry="30" fill="#FF69B4"/>
                    <rect x="-3" y="-2" width="6" height="35" fill="#8B4513"/>
                </g>
                
                <g transform="translate(430, 200)">
                    <ellipse cx="0" cy="-20" rx="18" ry="25" fill="#90EE90"/>
                    <rect x="-2.5" y="3" width="5" height="25" fill="#8B4513"/>
                </g>
                
                <g transform="translate(250, 280)">
                    <rect x="-120" y="0" width="240" height="20" fill="#FF69B4"/>
                    <rect x="-120" y="0" width="240" height="5" fill="#FFB6C1"/>
                    <rect x="-110" y="20" width="15" height="50" fill="#8B4513"/>
                    <rect x="95" y="20" width="15" height="50" fill="#8B4513"/>
                </g>
                
                <g transform="translate(250, 220)">
                    <rect x="-50" y="0" width="100" height="60" fill="#FFFACD" rx="5"/>
                    <rect x="-45" y="0" width="90" height="8" fill="#FFD700"/>
                    <rect x="-45" y="20" width="90" height="8" fill="#FFD700"/>
                    <rect x="-45" y="40" width="90" height="8" fill="#FFD700"/>
                    <rect x="-8" y="-20" width="16" height="20" fill="#FF69B4"/>
                    ${candles}
                </g>
                
                <g transform="translate(440, 260)">
                    <rect x="-20" y="-25" width="40" height="35" fill="${giftColor}" id="gift" rx="3"/>
                    <rect x="-3" y="-35" width="6" height="45" fill="#FFD700"/>
                    <rect x="-25" y="-8" width="50" height="6" fill="#FFD700"/>
                    <ellipse cx="0" cy="-8" rx="8" ry="6" fill="#FF69B4"/>
                </g>
                
                <g transform="translate(150, 200)">
                    <circle cx="0" cy="-15" r="12" fill="#FFDAB9"/>
                    <polygon points="0,-30 -10,-15 10,-15" fill="#FFD700"/>
                    <rect x="-10" y="0" width="20" height="30" fill="#4169E1"/>
                    <circle cx="-4" cy="-18" r="2" fill="#333"/>
                    <circle cx="4" cy="-18" r="2" fill="#333"/>
                </g>
                
                <g transform="translate(350, 200)">
                    <circle cx="0" cy="-15" r="12" fill="#FFDAB9"/>
                    <polygon points="0,-30 -10,-15 10,-15" fill="#FF69B4"/>
                    <rect x="-10" y="0" width="20" height="30" fill="#FF6347"/>
                    <circle cx="-4" cy="-18" r="2" fill="#333"/>
                    <circle cx="4" cy="-18" r="2" fill="#333"/>
                </g>
            `;
        }

        function darkenColor(color) {
            const hex = color.replace('#', '');
            const r = Math.max(0, parseInt(hex.substr(0, 2), 16) - 30);
            const g = Math.max(0, parseInt(hex.substr(2, 2), 16) - 30);
            const b = Math.max(0, parseInt(hex.substr(4, 2), 16) - 30);
            return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
        }

        function loadLevel(levelIndex) {
            currentLevel = levelIndex;
            foundDifferences = new Set();
            errors = 0;
            document.getElementById('error-display').textContent = '0';
            updateLevelDisplay();
            updateDifferenceDots();
            
            document.querySelectorAll('.difference-marker, .wrong-marker').forEach(m => m.remove());
            
            const level = levels[currentLevel];
            
            switch(levelIndex) {
                case 0:
                    createBeachScene(leftSVG, false);
                    createBeachScene(rightSVG, true);
                    break;
                case 1:
                    createLivingRoomScene(leftSVG, false);
                    createLivingRoomScene(rightSVG, true);
                    break;
                case 2:
                    createStreetScene(leftSVG, false);
                    createStreetScene(rightSVG, true);
                    break;
                case 3:
                    createForestScene(leftSVG, false);
                    createForestScene(rightSVG, true);
                    break;
                case 4:
                    createPartyScene(leftSVG, false);
                    createPartyScene(rightSVG, true);
                    break;
            }
            
            startTimer();
        }

        function createMarker(xPercent, yPercent, container, className) {
            const marker = document.createElement('div');
            marker.className = className;
            const rect = container.getBoundingClientRect();
            const x = (xPercent / 100) * rect.width;
            const y = (yPercent / 100) * rect.height;
            marker.style.left = `${x}px`;
            marker.style.top = `${y}px`;
            marker.style.transform = 'translate(-50%, -50%)';
            container.appendChild(marker);
            if (className === 'wrong-marker') setTimeout(() => marker.remove(), 500);
        }

        function checkDifference(xPercent, yPercent) {
            const level = levels[currentLevel];
            const tolerance = 12;
            
            for (let i = 0; i < level.differences.length; i++) {
                if (foundDifferences.has(i)) continue;
                const diff = level.differences[i];
                const distance = Math.sqrt(
                    Math.pow(xPercent - diff.x, 2) + 
                    Math.pow(yPercent - diff.y, 2)
                );
                if (distance <= tolerance) {
                    foundDifferences.add(i);
                    updateDifferenceDots();
                    createMarker(diff.x, diff.y, leftContainer, 'difference-marker');
                    createMarker(diff.x, diff.y, rightContainer, 'difference-marker');
                    if (foundDifferences.size === level.differences.length) levelComplete();
                    return true;
                }
            }
            return false;
        }

        function handleClick(e, container) {
            if (foundDifferences.size >= levels[currentLevel].differences.length) return;
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const xPercent = (x / rect.width) * 100;
            const yPercent = (y / rect.height) * 100;
            
            const isCorrect = checkDifference(xPercent, yPercent);
            if (!isCorrect) {
                errors++;
                document.getElementById('error-display').textContent = errors;
                createMarker(xPercent, yPercent, leftContainer, 'wrong-marker');
                createMarker(xPercent, yPercent, rightContainer, 'wrong-marker');
            }
        }

        function levelComplete() {
            stopTimer();
            const elapsed = (Date.now() - startTime) / 1000;
            document.getElementById('level-complete-message').textContent = `本关用时: ${formatTime(elapsed)}`;
            
            if (currentLevel === levels.length - 1) {
                setTimeout(() => {
                    const totalTime = (Date.now() - totalStartTime) / 1000;
                    document.getElementById('game-complete-message').textContent = `总用时: ${formatTime(totalTime)}\n总错误: ${errors}`;
                    document.getElementById('game-complete-modal').classList.add('active');
                }, 1000);
            } else {
                setTimeout(() => document.getElementById('level-complete-modal').classList.add('active'), 1000);
            }
        }

        function useHint() {
            const level = levels[currentLevel];
            const unfound = [];
            for (let i = 0; i < level.differences.length; i++) {
                if (!foundDifferences.has(i)) unfound.push(i);
            }
            if (unfound.length === 0) return;
            
            startTime -= 3000;
            const randomIndex = unfound[Math.floor(Math.random() * unfound.length)];
            const diff = level.differences[randomIndex];
            
            const createTempMarker = (container) => {
                const m = document.createElement('div');
                m.className = 'difference-marker';
                m.style.opacity = '0.5';
                m.style.left = `${diff.x}%`;
                m.style.top = `${diff.y}%`;
                container.appendChild(m);
                setTimeout(() => m.remove(), 2000);
            };
            
            createTempMarker(leftContainer);
            createTempMarker(rightContainer);
        }

        function restartGame() {
            stopTimer();
            totalStartTime = null;
            currentLevel = 0;
            foundDifferences = new Set();
            errors = 0;
            document.getElementById('game-complete-modal').classList.remove('active');
            document.getElementById('level-complete-modal').classList.remove('active');
            loadLevel(0);
        }

        leftContainer.addEventListener('click', (e) => handleClick(e, leftContainer));
        rightContainer.addEventListener('click', (e) => handleClick(e, rightContainer));

        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-modal').classList.remove('active');
            loadLevel(0);
        });

        document.getElementById('next-level-btn').addEventListener('click', () => {
            document.getElementById('level-complete-modal').classList.remove('active');
            loadLevel(currentLevel + 1);
        });

        document.getElementById('play-again-btn').addEventListener('click', restartGame);
        document.getElementById('restart-btn').addEventListener('click', restartGame);
        document.getElementById('hint-btn').addEventListener('click', useHint);
    </script>
</body>
</html>
